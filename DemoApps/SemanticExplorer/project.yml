name: SemanticExplorer
options:
  bundleIdPrefix: com.example
targets:
  SemanticExplorer:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - SemanticExplorer
    dependencies:
      - package: BGVisualSemanticsProcessor
        product: BGVisualSemanticsProcessor
      - package: BGVisualSemanticsProcessor
        product: BGVisualSemanticsProcessorVision
    info:
      path: SemanticExplorer/Info.plist
      properties:
        NSCameraUsageDescription: "This app needs camera access to take photos for semantic analysis."
        NSPhotoLibraryUsageDescription: "This app needs photo library access to analyze your images."
        UIBackgroundModes: [processing]
        BGTaskSchedulerPermittedIdentifiers: ["com.example.semanticexplorer.bgvs"]
        UILaunchScreen: {}
    settings:
      SWIFT_VERSION: 6.0
      ENABLE_STRICT_CONCURRENCY: YES

packages:
  BGVisualSemanticsProcessor:
    path: ../../
